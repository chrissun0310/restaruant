services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sun-master-fengshui-app
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    networks:
      - fengshui_net

  nginx:
    image: nginx:1.27-alpine
    container_name: sun-master-fengshui-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    networks:
      - fengshui_net

  certbot:
    image: certbot/certbot:latest
    container_name: sun-master-fengshui-certbot
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    networks:
      - fengshui_net

networks:
  fengshui_net:
    driver: bridge
